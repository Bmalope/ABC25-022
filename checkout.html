<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kabz Tech</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <img src="images/logo.jpg" width="125" height="100" alt="Kabz Tech Logo" class="logo">
        <input type="checkbox" id="menu-toggle" class="menu-checkbox">
            
            <label for="menu-toggle" class="hamburger-label" aria-label="Toggle navigation menu">
                <span class="hamburger-line"></span>
                <span class="hamburger-line"></span>
                <span class="hamburger-line"></span>
            </label>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="product.html">Products</a></li>
                <li><a href="cart.html">Cart</a></li>
                <li><a href="checkout.html">Checkout</a></li>
                <li><a href="account.html">Account</a></li>
                <li><a href="feedback.html">Feedback</a></li>
            </ul>
        </nav>
    </header>
    <!-- Checkout Section -->
    <main>
       
        <main class="main-content">
        <h2>Secure Checkout</h2>

        <div class="checkout-grid">
            
            <section class="checkout-form-section">
                <h3>Shipping Information</h3>
                <form action="#" method="POST">
                    <div class="form-group">
                        <label for="fullname">Full Name</label>
                        <input type="text" id="fullname" class="form-control" required>
                    </div>

                    <div class="form-group">
                        <label for="address">Delivery Address</label>
                        <input type="text" id="address" class="form-control" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" class="form-control" required>
                    </div>

                    <div class="form-group">
                        <label for="payment">Payment Method</label>
                        <select id="payment" class="form-control" required>
                            <option value="">Select Payment Option</option>
                            <option value="card">Credit/Debit Card</option>
                            <option value="mobile">Mobile Money (e.g. MyZaka/Orange Money)</option>
                            <option value="cod">Cash on Delivery</option>
                        </select>
                    </div>

                    <a href="account.html" class="btn">Proceed to Account</a>
                     <a href="cart.html" class="btn">Back to Cart</a>
                    </a>
                </form>
            </section>

            <aside class="checkout-summary-section">
                <h3>Order Summary</h3>
                <div class="summary-row">
                    <span>Subtotal:</span>
                    <span>P8,000.00</span>
                </div>
                <div class="summary-row">
                    <span>Tax:</span>
                    <span>P0.00</span>
                </div>
                <div class="summary-row" style="font-weight: bold; border-top: 1px solid #cbd5e1; padding-top: 10px;">
                    <span>Total:</span>
                    <span>P8,000.00</span>
                </div>
            </aside>

        </div>
    </main>
    </main>
    <!-- Footer -->
    <footer id="footer">
      <p>
          &copy; 2026 Kabz Tech. All Rights Reserved.
      </p>
    </footer>
</body>
</html>
